default:
  image: node:22
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

variables:
  PNPM_STORE_DIR: .pnpm-store
  HUSKY: '0'

stages: [check, test, build]

lint:
  stage: check
  script:
    - pnpm lint
    - pnpm format:check

typecheck:
  stage: check
  script: pnpm typecheck

unit:
  stage: test
  script: pnpm test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.0-noble
  script: pnpm e2e
  artifacts:
    when: always
    paths: [playwright-report/, test-results/]
    reports:
      junit: test-results/e2e-junit.xml
    expire_in: 1 week

build:
  stage: build
  script: pnpm build
  artifacts:
    paths: [dist/]
    expire_in: 1 week
