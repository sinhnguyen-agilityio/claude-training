# Runs the same checks as WORKFLOW.md step 5, one job per area.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels the older run of a branch, but never a run on main: it may be deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    # A hung step otherwise runs until GitHub's 6 h limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # lint and typecheck cover the whole workspace and are repeated in web and api on purpose,
      # so each job fails on its own and stays independent.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @app/web test:coverage

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API tests run against a real Postgres, one schema per test file (#37).
    # Same image and credentials as docker-compose.yml, so DATABASE_URL matches .env.example.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: users_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d users_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/users_dev
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # lint and typecheck cover the whole workspace and are repeated in web and api on purpose,
      # so each job fails on its own and stays independent.
      - run: pnpm lint
      - run: pnpm typecheck
      # AC2 of #47. The tests build their own schema per file (createTestDb), so they do not need
      # this; it checks that the migrations apply to a fresh database and matches the e2e job.
      - run: pnpm --filter @app/api db:migrate
      # The Vercel function is this bundle (#48). A change esbuild cannot bundle fails here, before a deploy.
      - run: pnpm api:bundle
      - run: test -s apps/api/dist/vercel.mjs
      # Fails below the 80% threshold in apps/api/vitest.config.ts.
      - run: pnpm --filter @app/api test:coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image and credentials as docker-compose.yml, so DATABASE_URL matches .env.example.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: users_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d users_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/users_dev
      # Playwright (#46) refuses a database that is DATABASE_URL, named users_dev or not local, so
      # the E2E tests get their own database, users_e2e, created in the same service below.
      E2E_DATABASE_URL: postgres://app:app@localhost:5432/users_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Needed once #46 lands: its Playwright config starts the API (:3101) and the preview server
      # itself, which needs the database migrated and seeded first (the per-test /api/reset
      # fixture restores the 25 seed users). main's config has no API yet, so these two steps
      # are harmless until then.
      - name: Create the E2E database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE users_e2e'
      - name: Migrate and seed the E2E database
        run: |
          pnpm db:migrate
          pnpm db:seed
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: pnpm --filter @app/web exec playwright install --with-deps chromium
      # timeout-minutes: 8 applies to this step only; the job-level 15 also covers install, the
      # Playwright download, and is intentional.
      # The 59 tests take under a minute. Once they finished but Playwright never exited (run 39944427327),
      # so this step is capped, and DEBUG logs how the preview server is shut down if it happens again.
      - run: pnpm e2e
        timeout-minutes: 8
        env:
          DEBUG: pw:webserver
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore

  claude-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The format-on-edit hook tests load Prettier from node_modules.
      - run: pnpm install --frozen-lockfile
      - run: node --test .claude/hooks/*.test.mjs

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Fails on known high or critical advisories in the dependencies that ship to users.
      - run: pnpm audit --prod --audit-level=high

  # Deploys (#49). vercel.json turns off Vercel's own Git deployments, so these jobs are the only way
  # to deploy. Both wait for every check job above; a failing job skips them. VERCEL_TOKEN,
  # VERCEL_ORG_ID and VERCEL_PROJECT_ID are repository secrets: they are only passed as environment
  # variables (the CLI reads them), never on a command line, and GitHub masks them in the logs.
  deploy-preview:
    needs: [web, api, e2e, claude-hooks, security]
    # Secrets are not available to a pull request from a fork, so those are skipped.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx vercel@65.14.0 pull --yes --environment=preview
      - run: pnpm dlx vercel@65.14.0 build
      - name: Deploy the preview
        id: deploy
        run: echo "url=$(pnpm dlx vercel@65.14.0 deploy --prebuilt)" >> "$GITHUB_OUTPUT"
      # One comment per pull request: found by its marker and updated on the next commit.
      - uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->'
            const lines = [marker, '', `Preview: ${process.env.PREVIEW_URL}`, '', `Commit ${context.sha.slice(0, 7)}`]
            const body = lines.join(String.fromCharCode(10))
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((c) => c.body?.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  deploy-production:
    needs: [web, api, e2e, claude-hooks, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Its own queue: a second push waits for the running deploy instead of cancelling it halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx vercel@65.14.0 pull --yes --environment=production
      - run: pnpm dlx vercel@65.14.0 build --prod
      - name: Deploy to production
        id: deploy
        run: echo "url=$(pnpm dlx vercel@65.14.0 deploy --prebuilt --prod)" >> "$GITHUB_OUTPUT"
      - name: Show the deployment URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Production deployment: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
      # GET /api/health is 200 when the database answers, 503 when it does not (#48). It is checked on
      # the public production domain: the per-deployment URL can be behind Vercel Deployment Protection
      # (401). The new deployment can take a few seconds to be served, so it is retried.
      - name: Check /api/health
        env:
          HEALTH_URL: https://snuser-mn.vercel.app/api/health
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::$HEALTH_URL did not return 200"
          exit 1
