# Runs the same checks as WORKFLOW.md step 5, one job per area.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    # A hung step otherwise runs until GitHub's 6 h limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm exec playwright install --with-deps chromium
      # The 59 tests take under a minute. Once they finished but Playwright never exited (run 39944427327),
      # so this step is capped, and DEBUG logs how the preview server is shut down if it happens again.
      - run: pnpm e2e
        timeout-minutes: 8
        env:
          DEBUG: pw:webserver
      # GitHub Pages serves the app under /claude-training/ (deploy.yml), so the base path is tested
      # here, on its own build and port, before it can break the deployed site (#26).
      - name: Smoke E2E under /claude-training/
        run: pnpm exec playwright test tests/e2e/subpath.spec.ts
        timeout-minutes: 5
        env:
          BASE_PATH: /claude-training/
          E2E_PORT: 4180
          DEBUG: pw:webserver
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

  claude-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The format-on-edit hook tests load Prettier from node_modules.
      - run: pnpm install --frozen-lockfile
      - run: node --test .claude/hooks/*.test.mjs

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Fails on known high or critical advisories in the dependencies that ship to users.
      - run: pnpm audit --prod --audit-level=high
