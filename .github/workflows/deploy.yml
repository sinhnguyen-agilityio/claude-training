# Publishes main to GitHub Pages once CI has passed on it. The app is static: MSW in the browser is
# the API (SPEC §2), so Pages can host it. Needs Settings → Pages → Source: GitHub Actions.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  BASE_PATH: /claude-training/

jobs:
  build:
    # workflow_run fires for every CI run whose head branch is *named* main, including failed runs
    # and pull requests from a fork's own main. Deploy only a successful push to this repo's main.
    # A manual run deploys only from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI tested, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Pages has no SPA rewrites: a deep link like /claude-training/users/new gets 404.html, which
      # is the app itself, so the router takes over (the HTTP status is still 404).
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the site and the mock API worker respond
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl -fsS -o /dev/null "$SITE_URL"
          curl -fsS -o /dev/null "${SITE_URL%/}/mockServiceWorker.js"
